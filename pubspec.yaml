name: jalabiya_app
description: Order a made-to-measure Sudanese jalabiya and follow it with your tailor.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"   # Flutter 3.24 or newer

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  webview_flutter: ^4.10.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  intl: any
  flutter_local_notifications: ^22.3.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/engine/
    - assets/icon/logo_app.png
